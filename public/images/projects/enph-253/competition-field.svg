<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Mars habitat mission field</title>
  <desc id="description">A simplified top-down competition field showing a start zone, rough terrain, obstacles, a solar panel, radio tower parts, a habitat building zone, and mineral samples.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#173f29" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="panelCells" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#dfe9e1"/>
      <path d="M18 0H0V18" fill="none" stroke="#247847" stroke-opacity=".5" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#173f29" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#247847"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f4f2e9"/>
  <text x="64" y="55" fill="#173f29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">AUTONOMOUS MISSION FIELD · APPROX. 8 FT × 8 FT</text>
  <text x="1136" y="55" fill="#667269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">SCHEMATIC · NOT TO SCALE</text>

  <g filter="url(#shadow)">
    <rect x="64" y="82" width="1072" height="746" rx="24" fill="#e8ece4" stroke="#173f29" stroke-width="3"/>
    <rect x="64" y="82" width="1072" height="746" rx="24" fill="url(#grid)"/>
  </g>

  <!-- Field elevations and rough terrain -->
  <path d="M64 82H490V274H604V575H448V828H64Z" fill="#ece7d9" stroke="#173f29" stroke-opacity=".18" stroke-width="2"/>
  <path d="M490 82H1136V828H448V575H604V274H490Z" fill="#dce9dc" stroke="#173f29" stroke-opacity=".18" stroke-width="2"/>
  <path d="M448 828V575H604V274H490V82" fill="none" stroke="#a97c38" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="477" y="546" transform="rotate(-90 477 546)" fill="#8c641f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.5">RAMP + ELEVATION CHANGES</text>

  <!-- Start pad and rover -->
  <g transform="translate(100 116)">
    <text x="0" y="-13" fill="#173f29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">START</text>
    <rect width="176" height="108" rx="16" fill="#f3c390" stroke="#173f29" stroke-width="3"/>
    <g transform="translate(52 25)" stroke="#173f29" stroke-width="4">
      <rect x="9" y="4" width="54" height="48" rx="8" fill="#faf9f4"/>
      <circle cx="10" cy="12" r="8" fill="#247847"/>
      <circle cx="62" cy="12" r="8" fill="#247847"/>
      <circle cx="10" cy="45" r="8" fill="#247847"/>
      <circle cx="62" cy="45" r="8" fill="#247847"/>
      <path d="M36 14v25m-10-8 10 10 10-10" fill="none"/>
    </g>
  </g>

  <!-- Suggested mission path -->
  <path d="M276 170C356 188 344 333 414 367S568 435 636 422 691 303 770 285 904 274 960 354 966 505 902 548 804 609 725 676" fill="none" stroke="#247847" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 11" marker-end="url(#arrow)" opacity=".72"/>

  <!-- Terrain marker 01 -->
  <g transform="translate(315 287)">
    <circle r="24" fill="#173f29"/>
    <text y="6" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">01</text>
    <text x="38" y="-3" fill="#173f29" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Rough terrain</text>
    <text x="38" y="19" fill="#667269" font-family="system-ui, sans-serif" font-size="13">Ramp and uneven transitions</text>
  </g>

  <!-- Solar panel 04 -->
  <g transform="translate(500 348)">
    <rect width="154" height="88" rx="8" fill="url(#panelCells)" stroke="#173f29" stroke-width="3"/>
    <path d="M77 88v24m-28 0h56" fill="none" stroke="#173f29" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 12h126v64H14Z" fill="#a97c38" opacity=".22" stroke="#a97c38" stroke-width="2" stroke-dasharray="7 5"/>
    <circle cx="-18" cy="0" r="24" fill="#173f29"/>
    <text x="-18" y="6" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">04</text>
    <text x="77" y="144" fill="#173f29" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Solar panel + cover</text>
    <g transform="translate(142 -18)">
      <rect width="28" height="38" rx="4" fill="#247847" stroke="#173f29" stroke-width="2"/>
      <circle cx="14" cy="19" r="6" fill="#f4f2e9"/>
    </g>
  </g>

  <!-- Radio tower 03 -->
  <g transform="translate(765 122)">
    <circle cx="76" cy="69" r="54" fill="#f7ed9c" fill-opacity=".72" stroke="#247847" stroke-width="3" stroke-dasharray="9 7"/>
    <circle cx="-16" cy="4" r="24" fill="#173f29"/>
    <text x="-16" y="10" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">03</text>
    <g transform="translate(31 28)" fill="#faf9f4" stroke="#173f29" stroke-width="3">
      <rect width="12" height="74" rx="3"/>
      <rect x="25" y="12" width="12" height="62" rx="3"/>
      <rect x="50" y="25" width="12" height="49" rx="3"/>
      <rect x="75" y="38" width="12" height="36" rx="3"/>
    </g>
    <text x="76" y="145" fill="#173f29" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Radio tower</text>
    <text x="76" y="165" fill="#667269" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Nesting mast pieces</text>
  </g>

  <!-- Habitat 02 -->
  <g transform="translate(822 455)">
    <circle cx="96" cy="84" r="112" fill="#f7ed9c" fill-opacity=".55" stroke="#247847" stroke-width="4" stroke-dasharray="12 9"/>
    <circle cx="-30" cy="-1" r="24" fill="#173f29"/>
    <text x="-30" y="5" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">02</text>
    <g transform="translate(28 30)" stroke="#173f29" stroke-width="3">
      <rect width="68" height="58" rx="8" fill="#faf9f4"/>
      <rect x="67" y="18" width="68" height="58" rx="8" fill="#d7b379"/>
      <path d="M21 58v-21h25v21m64 18V51" fill="none"/>
    </g>
    <text x="96" y="172" fill="#173f29" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Habitat build area</text>
    <text x="96" y="193" fill="#667269" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Pre-made colony modules</text>
  </g>

  <!-- Mineral samples 05 -->
  <g transform="translate(692 686)">
    <circle cx="-34" cy="-35" r="24" fill="#173f29"/>
    <text x="-34" y="-29" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">05</text>
    <g stroke="#173f29" stroke-width="3">
      <circle cx="20" cy="18" r="16" fill="#9cd5bc"/>
      <circle cx="62" cy="-9" r="13" fill="#df8e83"/>
      <circle cx="101" cy="26" r="18" fill="#d7b379"/>
      <circle cx="146" cy="-6" r="15" fill="#9ab6db"/>
    </g>
    <text x="82" y="67" fill="#173f29" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Mineral samples</text>
    <text x="82" y="87" fill="#667269" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Search and collect</text>
  </g>

  <!-- Obstacles -->
  <g fill="#a5a89e" stroke="#173f29" stroke-width="3">
    <path d="m315 112 35-14 31 17-4 35-35 13-29-20Z"/>
    <path d="m173 454 35-17 34 19-4 38-40 13-33-23Z"/>
    <path d="m357 691 31-18 37 13 5 35-28 24-39-9Z"/>
    <path d="m1044 308 31-17 34 13 3 34-28 23-37-10Z"/>
    <path d="m1047 702 35-18 29 17-3 34-37 15-28-21Z"/>
  </g>
  <g fill="#667269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">
    <text x="308" y="179">BOULDER</text>
    <text x="160" y="526">BOULDER</text>
  </g>

  <!-- Legend -->
  <g transform="translate(92 784)" fill="#667269" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">
    <path d="M0 0h32" stroke="#247847" stroke-width="4" stroke-dasharray="8 7"/>
    <text x="42" y="4">AUTONOMOUS ROUTE</text>
    <path d="M190 0h32" stroke="#a97c38" stroke-width="4" stroke-dasharray="8 7"/>
    <text x="232" y="4">ELEVATION EDGE</text>
  </g>
</svg>
